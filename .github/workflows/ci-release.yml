name: CI and release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
            smoke: false
          - os: ubuntu-latest
            node: 24
            smoke: true
          - os: windows-latest
            node: 24
            smoke: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run Linux tests
        if: runner.os == 'Linux'
        run: npm run test:linux
      - name: Run Windows tests
        if: runner.os == 'Windows'
        run: npm run test:windows
      - run: npm run build
      - name: Inspect package contents
        shell: bash
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          npm run check:package -- pack.json
      - name: Smoke-test packed installation on Linux
        if: matrix.smoke && runner.os == 'Linux'
        run: |
          mkdir release
          npm pack --pack-destination release
          mv release/rrs-*.tgz release/rrs.tgz
          npm install --global --prefix "$RUNNER_TEMP/rrs-smoke" ./release/rrs.tgz
          "$RUNNER_TEMP/rrs-smoke/bin/rrs" --help
          test "$("$RUNNER_TEMP/rrs-smoke/bin/rrs" --version)" = "0.1.0"
          npm exec --yes --package="./release/rrs.tgz" -- rrs --version
      - name: Smoke-test packed installation on Windows
        if: matrix.smoke && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release
          npm pack --pack-destination release
          $tarball = Get-ChildItem release/rrs-*.tgz
          Move-Item $tarball.FullName release/rrs.tgz
          $prefix = Join-Path $env:RUNNER_TEMP rrs-smoke
          npm install --global --prefix $prefix ./release/rrs.tgz
          $rrs = Join-Path $prefix rrs.cmd
          & $rrs --help
          if ((& $rrs --version) -ne "0.1.0") { throw "installed RRS version mismatch" }
          npm exec --yes --package="./release/rrs.tgz" -- rrs --version

  release:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build release tarball
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          npm version "$VERSION" --no-git-tag-version
          npm run typecheck
          npm run test:linux
          mkdir release
          npm pack --pack-destination release
          mv release/rrs-*.tgz release/rrs.tgz
          npm install --global --prefix "$RUNNER_TEMP/rrs-smoke" ./release/rrs.tgz
          test "$("$RUNNER_TEMP/rrs-smoke/bin/rrs" --version)" = "$VERSION"
          "$RUNNER_TEMP/rrs-smoke/bin/rrs" --help
          npm exec --yes --package="./release/rrs.tgz" -- rrs --version
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/rrs.tgz --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" release/rrs.tgz \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes \
              --latest
          fi
